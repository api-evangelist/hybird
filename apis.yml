aid: hybird
name: HyBird
description: >-
  HyBird is an industrial software company behind Clarity, a modular Industrial
  Operating System built on a self-updating, photorealistic living digital twin.
  Clarity unifies 3D twin and document management, engineering and management of
  change, P&ID management, intelligent (preventive, predictive, reactive)
  maintenance, EHS, robotic inspection with AI defect detection, structural
  integrity, asset performance monitoring, and an AR-guided connected workforce
  for heavy industries such as oil & gas, cement and building materials, energy,
  terminals, and nuclear. It integrates with EAM/CMMS platforms including SAP PM,
  S/4HANA, Microsoft Dynamics, and IBM Maximo. HyBird is a Techstars-backed
  company profiled in the API Evangelist network; it publishes no public API,
  developer portal, or SDKs at this time.
